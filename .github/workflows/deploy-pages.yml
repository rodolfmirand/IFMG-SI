name: Deploy ListaFácil (GitHub Pages)

# Publica APENAS a subpasta do site deste monorepo.
on:
  push:
    branches: [main]
    paths:
      - "Interface Humano Computador/trabalho-final/software/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes sobrescrevendo um ao outro.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Sobe só a pasta do site (caminho com espaços, entre aspas).
          path: "Interface Humano Computador/trabalho-final/software"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
